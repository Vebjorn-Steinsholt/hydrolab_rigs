# LinMot sloshing oscillator (OSCILLATOR.md). Values from the C + D rig test, 2026-10-23.
/oscillators/sloshing/controller:
  ros__parameters:
    rig: oscillator
    drive_name: linmot
    drive_motion: linear
    serial_port: /dev/linmot_bridge   # udev rule rpi/99-linmot-bridge.rules
    upright_position_m: 0.1
    # Goal travel, 15 mm inside the steel box (hard stops at 0 and 200 mm): from 50 mm strokes the
    # slide overshot the setpoint by ~3 mm at each end with margins 1.2 / 5.0 (2026-10-23).
    travel_minimum_m: 0.015
    travel_maximum_m: 0.185
    min_position_m: 0.005             # the bridge firmware's limits
    max_position_m: 0.195
    max_acceleration_mps2: 20.0
    # The drive's speed and acceleration limits per goal, as multiples of the motion's peaks.
    # 1.2 / 5.0 halved the lag (~100 ms instead of ~200 ms) but made the rig hum mechanically and
    # overshoot the setpoint by ~3 mm at each end; 1.0 / 1.0 is quiet up to 100 mm at 2 s
    # (2026-10-23, OSCILLATOR.md step G).
    positioning_velocity_margin: 1.0
    positioning_acceleration_margin: 1.0
    max_goal_acceleration_mps2: 9.81
    min_period_s: 0.2
    return_to_upright_max_velocity_mps: 0.1
    step_timeout_ms: 2000

/oscillators/sloshing/bridge:
  ros__parameters:
    rig: oscillator                   # topic names: oscillator_state, oscillator_message

/oscillators/vertical/controller:
  ros__parameters:
    rig: oscillator
    drive_name: indradrive
    driver_address: "192.168.1.70"   # the ladertanken gateway, slave 3 (daisy chain)
    driver_port: 502
    driver_unit_id: 1
    input_base_reg: 7                # bytes 14-27; slave 2 (wavemaker) has 0-13
    input_word_count: 7              # 14 bytes: status, position, velocity, diag (U32)
    output_base_reg: 6               # bytes 12-23; slave 2 (wavemaker) has 0-11
    output_word_count: 6             # 12 bytes: control, target, speed cap, override
    input_uses_fc4: true
    status_base_reg: 768
    status_word_count: 9
    poll_interval_ms: 20
    write_only_dirty: false
    profibus_address: 3              # P-0-4025 on the drive, MGate slave 3
    drive_motion: linear
    drive_m_per_unit: 0.001              # T2: position tag in mm (0.0001 mm resolution)
    drive_velocity_per_unit_per_s: 6.0   # T2: velocity tag in 10 mm/min (0.001 mm/min resolution)
    drive_direction: -1                  # T2: + command moves the slide down; rig uses + = up
    upright_position_m: 0.0          # drive position about 0 mm at mid-travel
    travel_minimum_m: -0.200         # inside the drive's -211 mm
    travel_maximum_m: 0.200          # inside the drive's +211 mm
    max_velocity_rpm: 600.0          # velocity tag units: 600 x 10 mm/min = 0.1 m/s - set from the rig
    hold_velocity_rpm: 60.0          # 10 mm/s
    in_position_tol_deg: 0.1         # position tag units: 0.1 mm
    step_timeout_ms: 10000
    return_to_upright_max_velocity_mps: 0.02
    # acceleration caps (max_goal_acceleration_mps2) and min_period_s: from the rig

/oscillators/vertical/bridge:
  ros__parameters:
    rig: oscillator                   # topic names: oscillator_state, oscillator_message
