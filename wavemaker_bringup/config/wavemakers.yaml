/wavemakers/ladertanken/controller:
  ros__parameters:
    drive_name: "indradrive"
    driver_address: "192.168.1.70"
    driver_port: 502
    driver_unit_id: 1

    input_base_reg: 0
    input_word_count: 7
    output_base_reg: 0
    output_word_count: 6
    input_uses_fc4: true

    status_base_reg: 768       # 0x0300
    status_word_count: 9

    poll_interval_ms: 20      # poll_rate_probe 2026-10-07: cycles 4-8 ms, rare ~210 ms stalls
    timeout_ms: 1000
    reconnect_ms: 2000
    write_only_dirty: false

    profibus_address: 2
    # 2026-10-20: raised for 0.171 m / 1.3 s with the gain table and hinge_height 0.09
    # (needs +/-248 deg, 200 rpm); +10 % travel, 1.2 x peak speed. No mechanical end stops.
    max_velocity_rpm: 240.0
    min_position_deg: -275.0
    max_position_deg: 275.0
    in_position_tol_deg: 0.1
    step_timeout_ms: 10000
    # The code's defaults, written out (2026-11-12) so every limit is visible here.
    max_goal_acceleration_mps2: 0.0   # 0 = no limit: only the drive's own acceleration limits a goal
    min_period_s: 0.0                 # 0 = no limit
    return_to_upright_max_velocity_mps: 0.1      # at the flap top
    return_to_upright_default_tolerance_m: 0.002  # at the flap top (about 4.8 deg of drive)
    hold_velocity_rpm: 10.0           # speed cap while holding position
    positioning_velocity_margin: 1.2  # speed cap = peak speed of the goal x this
    soft_stop_timeout_s: 0.2          # no soft stop message for this long counts as pressed

    wavemaker_type: "flap"
    upright_position_m: 0.0  # Upright oscillation center [m]
    upright_is_minimum: false
    water_depth: 1.0         
    flap_attachment_height: 1.39  # above the floor: 1.30 above the hinge (2026-11-13; was 1.30)
    hinge_height: 0.09  # pivot above the floor, wall below closed (2026-10-20)
    drive_motion: "angular"
    actuator_upright_angle_deg: 0.0
    # 4.13 cm at the attachment per 100 deg of drive (2026-11-13; was 0.00053): six holds from
    # -0.09 to +0.09 m, flap tilt by inclinometer = 0.78 x what 0.00053 predicted (fit to 3 %).
    actuator_lead_m_per_degree: 0.000413
    # Measured / target wave height (regular waves only); the stroke is divided by it.
    # 1.0 = linear theory. To correct: new gain = old gain * measured / target.
    wavemaker_transfer_gain: 1.13
    # Gain per period [s], interpolated linearly, nearest end value outside; replaces
    # wavemaker_transfer_gain when set (COMMISSIONING.md, Transfer gain calibration).
    # 2026-11-13, with the geometry above: transfer_function on item38 run 3 (irregular, Hs 0.03 m,
    # 120 s, WP1 at 3 m, depth 0.98 m), +-0.01-0.02 at 0.8-1.3 s and 1.6 s, +-0.05-0.10 at 1.4,
    # 1.5 and 1.8 s. 0.6 and 2.0 s are outside what that run measured: the 2026-10-20 values
    # x 1.3787, the factor that keeps their waves unchanged under the new geometry.
    # Before 2026-11-13 (old geometry): [0.64, 0.70, 0.78, 0.80, 0.71, 0.76, 0.76, 0.75, 0.75,
    # 0.75, 0.74, 0.76], from the 2026-10-20 WP1 runs (Calib20oct.BIN). To be checked with regular
    # runs at 1.0 m (wave_sessions/2026-11-13_check).
    wavemaker_transfer_gain_periods: [0.6, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.8, 2.0]
    wavemaker_transfer_gain_values:  [0.88, 1.08, 1.15, 1.11, 1.13, 1.15, 1.16, 1.13, 1.15, 1.15, 1.11, 1.05]

/wavemakers/ladertanken/bridge:
  ros__parameters:
    heartbeat_timeout: 1.0   # stop the wave this long after the page's heartbeat stops (TODO 49)

/wavemakers/lilletanken/controller:
  ros__parameters:
    drive_name: "indradrive"
    wavemaker_type: "piston"
    travel_minimum_m: 0.0
    travel_maximum_m: 0.5
    water_depth: 1.0
    # flap_attachment_height omitted — fine, piston never checks it
    drive_motion: "linear"
    max_velocity_rpm: 100.0        # the controller's default, made visible; set from the drive when deployed (TODO 19)
    wavemaker_transfer_gain: 1.0  # see ladertanken

/wavemakers/mclab/controller:
  ros__parameters:
    drive_name: "indradrive"
    wavemaker_type: "flap"
    travel_minimum_m: 0.0
    travel_maximum_m: 0.5
    upright_position_m: 0.0
    upright_is_minimum: false
    water_depth: 1.5
    flap_attachment_height: 1.95   # must be > water_depth (1.5)
    hinge_height: 0.5
    drive_motion: "linear"
    max_velocity_rpm: 100.0        # the controller's default, made visible; set from the drive when deployed (TODO 19)
    wavemaker_transfer_gain: 1.0  # see ladertanken
